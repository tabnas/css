# The TS/Go differential probe — runs scripts/divergence-probe.sh as a GATE.
#
# This is the ONLY place CI runs the TS/Go probe. rust.yml's `probe` job
# runs a different script, scripts/divergence-probe-rs.sh, which compares
# TypeScript with RUST; neither covers the other's pair, so this workflow is
# not a duplicate of that job and must not be deleted as one. The Go half of
# this probe (go/divergence_probe_test.go) is inert under a plain `go test`,
# so the polyglot ci.yml does not run it either.
#
# WHY THIS IS SEPARATE FROM ci.yml
#
# ci.yml is the org-standard thin caller into the shared polyglot workflow.
# This job needs BOTH runtimes built and running against each other in one
# step, which is not something the shared workflow expresses, and pushing a
# css-specific job upstream would put it in every repo's matrix.
#
# WHY IT RUNS ONE OS
#
# The probe compares the two runtimes to EACH OTHER, not to a golden file, so
# a second OS re-answers a question the first already answered. The corpus is
# generated from a fixed seed in the script, so a run is reproducible without
# vendoring anything and without a matrix.
name: divergence

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Named for the pair it compares, so its check is not a second `probe`
  # beside rust.yml's TS/Rust job.
  ts-go-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The probe reads the two runtimes' results as text, so a checkout that
      # rewrote line endings would compare inputs neither runtime was given.
      # Matches the shared workflow, which sets this for the same reason.
      - name: no autocrlf
        run: git config --global core.autocrlf false

      # ts/package.json declares engines.node >=24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      # The Go version is the one go/go.mod declares, not a second copy of it
      # here that can fall behind.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      # The probe runs the TS port from ts/dist, so it needs a real build —
      # not just an install. A stale dist would compare the previous commit's
      # TypeScript against this commit's Go and report a divergence that is
      # an artefact of the build, or miss one that is real.
      #
      # `npm install`, not `npm ci`: this repository tracks no lockfile and
      # gitignores `package-lock.json`, so `npm ci` exits with EUSAGE before
      # it installs anything. A probe job that dies there reports a red gate
      # that compared no runtimes at all.
      - name: build ts
        working-directory: ts
        run: |
          npm install
          npm run build

      - name: probe
        run: bash scripts/divergence-probe.sh 4000
